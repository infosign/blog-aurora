name: Daily rebuild

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at 00:00 UTC (09:00 JST)

jobs:
  trigger-amplify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Amplify build
        run: |
          curl -X POST -d {} "${{ secrets.AMPLIFY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json"
